<style>
/* Layout: sticky brand bar + scrollable module tabs, one working module at a time in a 1200px column.
   --accent is overwritten at runtime from the client's brand colour (CONFIG / Brand settings). */
:root {
  --bg: #f4f5f2;
  --surface: #ffffff;
  --surface-2: #eceee9;
  --fg: #1b1f1c;
  --fg-2: #4b524d;
  --muted: #747c76;
  --line: #d9ddd7;
  --accent: #2f7d5b;
  --on-accent: #ffffff;
  --good: #2a7a48; --good-soft: #ddf0e3;
  --warn: #93600d; --warn-soft: #f7ead0;
  --bad: #b23a2c;  --bad-soft: #f8dfda;
  --info: #335f9c; --info-soft: #dfe8f5;
  --shadow: 0 1px 2px rgba(20,30,25,.05), 0 6px 20px rgba(20,30,25,.06);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121513; --surface: #1a1e1b; --surface-2: #232825; --fg: #eef1ee; --fg-2: #c3c9c4;
    --muted: #8f9791; --line: #2f3531;
    --good: #6fcf94; --good-soft: #1d3326; --warn: #e8b55a; --warn-soft: #3a2e17;
    --bad: #f08a7c; --bad-soft: #3d201c; --info: #8db4ea; --info-soft: #1c2a3e;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121513; --surface: #1a1e1b; --surface-2: #232825; --fg: #eef1ee; --fg-2: #c3c9c4;
  --muted: #8f9791; --line: #2f3531;
  --good: #6fcf94; --good-soft: #1d3326; --warn: #e8b55a; --warn-soft: #3a2e17;
  --bad: #f08a7c; --bad-soft: #3d201c; --info: #8db4ea; --info-soft: #1c2a3e;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); margin: 0; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: .85em; }
.muted { color: var(--muted); }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 220px; }
.logo { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 1.05rem; flex: none; }
.brand-name { font-family: var(--display); font-weight: 700; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: .78rem; color: var(--muted); }
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tabs { max-width: 1200px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 10px 12px; border-bottom: 2px solid transparent; color: var(--fg-2); font-weight: 600; font-size: .9rem; white-space: nowrap; cursor: pointer; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 20px; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.section-head p { color: var(--fg-2); max-width: 62ch; margin-top: 4px; }

/* Controls */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: .88rem; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--fg-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 5px 10px; font-size: .8rem; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
input[type=text], input[type=number], input[type=email], input[type=tel], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 70px; }
label.field { display: grid; gap: 4px; font-size: .82rem; font-weight: 600; color: var(--fg-2); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-items: end; }

/* Surfaces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.panel > h3 { margin-bottom: 12px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; }
.grid-2.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 860px) { .grid-2, .grid-2.even { grid-template-columns: minmax(0, 1fr); } }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; }
.kpi .v { font-family: var(--display); font-size: 1.75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: .8rem; }
.up { color: var(--good); } .down { color: var(--bad); }

.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .74rem; font-weight: 600; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.plain { background: var(--surface-2); color: var(--fg-2); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
td.r, th.r { text-align: right; }

.feed { display: grid; gap: 10px; max-height: 340px; overflow-y: auto; }
.feed-item { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: baseline; font-size: .88rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); transform: translateY(-1px); }
.dot.inv { background: var(--warn); } .dot.rev { background: var(--info); } .dot.crm { background: var(--good); }

/* Chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid line { stroke: var(--line); }
.chart text { fill: var(--muted); font: 11px var(--body); }

/* Website preview */
.browser { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
.browser-bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.browser-bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: block; }
.browser-bar .url { flex: 1; min-width: 0; background: var(--surface); border-radius: 6px; padding: 3px 10px; font: 12px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.site-hero { padding: 40px 28px; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 88%, #000), var(--accent)); color: var(--on-accent); display: grid; gap: 10px; }
.site-hero h1 { font-size: clamp(1.7rem, 4vw, 2.5rem); }
.site-hero p { max-width: 50ch; opacity: .92; }
.site-hero .btn { justify-self: start; background: var(--on-accent); color: var(--accent); border: 0; }
.site-body { padding: 24px 28px; display: grid; gap: 20px; }
.services { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.service { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 2px; }
.service b { font-weight: 600; }
.stars { color: #e0a213; letter-spacing: 1px; }

/* Chat */
.chat { display: grid; grid-template-rows: auto 1fr auto; height: 520px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.chat-head { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.chan { display: flex; gap: 4px; margin-left: auto; }
.chan button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 3px 10px; font-size: .76rem; cursor: pointer; }
.chan button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.msgs { padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.msg { max-width: 80%; padding: 8px 12px; border-radius: 14px; font-size: .9rem; white-space: pre-wrap; }
.msg.bot { background: var(--surface); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.me { background: var(--accent); color: var(--on-accent); align-self: flex-end; border-bottom-right-radius: 4px; }
.chat form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px dashed var(--line); background: none; border-radius: 999px; padding: 4px 10px; font-size: .8rem; cursor: pointer; color: var(--fg-2); }
.chip:hover { border-color: var(--accent); color: var(--fg); }

/* CRM drawer */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters input { max-width: 260px; }
.seg { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .82rem; font-weight: 600; cursor: pointer; }
.seg[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.profile { display: grid; gap: 14px; }
.profile dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 0; }
.profile dt { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.profile dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Reviews */
.review { border-bottom: 1px solid var(--line); padding-block: 12px; display: grid; gap: 6px; }
.review:last-child { border-bottom: 0; }
.review-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.reply { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: .88rem; }
.bars { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: 24px 1fr 32px; gap: 8px; align-items: center; font-size: .82rem; }
.bar-track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: #e0a213; }

/* Automations */
.autos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.auto { display: grid; gap: 10px; align-content: start; }
.flow { display: grid; gap: 4px; font-size: .86rem; }
.flow span { display: block; padding: 6px 10px; border-radius: 6px; background: var(--surface-2); }
.flow span b { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 6px; }
.auto-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .82rem; }
.switch { position: relative; width: 40px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(18px); }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Inventory */
.stock-bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; min-width: 60px; }
.stock-bar > div { height: 100%; }
.alert-list { display: grid; gap: 8px; }
.alert { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--fg); font-size: .88rem; flex-wrap: wrap; }
.po { font: 12.5px/1.55 var(--mono); background: var(--surface-2); border-radius: 8px; padding: 12px; white-space: pre-wrap; overflow-x: auto; }
.seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg-ctl button { border: 0; background: var(--surface); padding: 7px 12px; font-weight: 600; font-size: .85rem; cursor: pointer; }
.seg-ctl button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* Packages */
.tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.tier { display: grid; gap: 10px; align-content: start; cursor: pointer; border-width: 2px; }
.tier[aria-pressed="true"] { border-color: var(--accent); }
.tier .price { font-family: var(--display); font-size: 1.6rem; font-weight: 700; }
.tier ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: .88rem; color: var(--fg-2); }
.tier .promise { font-size: .86rem; font-style: italic; }
.addons { display: grid; gap: 8px; }
.addon { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.addon label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.total .v { font-family: var(--display); font-size: 1.6rem; font-weight: 700; }

/* Brand settings */
.settings { display: grid; gap: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: .88rem; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); }
.inline-confirm { display: inline-flex; gap: 6px; align-items: center; font-size: .84rem; }
.empty { padding: 24px; text-align: center; color: var(--muted); }
.err { color: var(--bad); font-size: .84rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const $ = (s, r = document) => r.querySelector(s);

const cur = n => CONFIG.currency + Number(n).toLocaleString("en-GB", { maximumFractionDigits: n % 1 ? 2 : 0, minimumFractionDigits: n % 1 ? 2 : 0 });
const fill = (s, p) => s.replace("{customers}", p.customerWord).replace("{booking}", cap(p.bookingWord));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const DAY = 86400000;
function ago(ts) {
  const d = Math.round((Date.now() - ts) / 60000);
  if (d < 1) return "just now"; if (d < 60) return d + "m ago";
  if (d < 1440) return Math.round(d / 60) + "h ago"; return Math.round(d / 1440) + "d ago";
}
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600);
}

const LAST = ["Rossi","Bianchi","Ferrari","Romano","Colombo","Greco","Conti","Marino","Costa","Bruno","Gallo","Rinaldi","Moretti","Barbieri","Lombardi","Fontana","Hughes","Silva","Khan","Novak"];
const SOURCES = ["Website", "Google", "Instagram", "Walk-in", "Referral", "WhatsApp", "AI chat"];

function seedState(key) {
  const p = CONFIG.presets[key];
  const r = rng(key.split("").reduce((a, c) => a + c.charCodeAt(0), 7) * 97);
  const now = Date.now();
  const customers = [];
  const n = 64;
  for (let i = 0; i < n; i++) {
    // more customers join recently: gradual database growth
    const firstDays = Math.round(Math.pow(r(), 1.6) * 360);
    const visits = 1 + Math.floor(Math.pow(r(), 2) * 18);
    const lastDays = Math.min(firstDays, Math.round(r() < .25 ? 45 + r() * 80 : r() * 40));
    const spend = Math.round(visits * p.avgTicket * (.7 + r() * .7));
    const fn = FIRST[Math.floor(r() * FIRST.length)], ln = LAST[Math.floor(r() * LAST.length)];
    customers.push({
      id: "C" + (1001 + i), name: fn + " " + ln,
      phone: "+39 3" + Math.floor(10 + r() * 89) + " " + Math.floor(100000 + r() * 899999),
      email: (fn + "." + ln).toLowerCase() + "@mail.com",
      first: now - firstDays * DAY, last: now - lastDays * DAY, visits, spend,
      source: SOURCES[Math.floor(r() * SOURCES.length)], birthdaySoon: r() < .06, notes: ""
    });
  }
  const reviews = p.reviews.map(([stars, name, text], i) => ({
    id: "R" + i, stars, name, text, at: now - (i * 4 + 1) * DAY,
    reply: i % 2 === 1 ? replyFor({ stars, name }, p.name) : ""
  }));
  // older reviews so the rating summary has volume
  const history = { 5: 58, 4: 21, 3: 6, 2: 3, 1: 2 };
  const inventory = p.inventory.map(([sku, name, unit, qty, min, cost, supplier]) => ({ sku, name, unit, qty, min, cost, supplier }));
  const moves = [];
  inventory.slice(0, 5).forEach((it, i) => {
    moves.push({ at: now - (i + 1) * 9 * 3600000, sku: it.sku, type: i % 2 ? "out" : "in", qty: i % 2 ? 2 : Math.max(2, Math.round(it.min / 2)), by: ["Marta", "Luca", "Owner"][i % 3], note: "" });
  });
  const autos = {};
  AUTOMATIONS.forEach((a, i) => { const sent = Math.round(40 + r() * 260); autos[a.id] = { on: i !== 5, sent, converted: Math.round(sent * a.rate) }; });
  const feed = [
    { at: now - 25 * 60000, kind: "crm", text: `New ${p.bookingWord} from the AI chat: ${customers[3].name}` },
    { at: now - 2 * 3600000, kind: "rev", text: `New 5-star Google review from ${p.reviews[0][1]}` },
    { at: now - 5 * 3600000, kind: "auto", text: `Win-back campaign sent to 9 at-risk ${p.customerWord}` },
    { at: now - 9 * 3600000, kind: "inv", text: `${moves[0].qty} ${inventory[0].unit} ${inventory[0].name}: ${p.movement.in.toLowerCase()}` }
  ];
  const bookings = Math.round(40 + r() * 60);
  return { key, brand: { name: p.name, accent: p.accent, domain: p.domain }, customers, reviews, history, inventory, moves, autos, feed, bookings, missed: Math.round(6 + r() * 10), chat: null, tier: "growth", addons: ["inv"] };
}

const kpi = (l, v, d) => `<div class="kpi"><span class="eyebrow">${l}</span><span class="v">${v}</span><span class="d muted">${d}</span></div>`;

function growthChart() {
  const W = 600, H = 220, pl = 40, pr = 14, pt = 12, pb = 28;
  const weeks = 12, now = Date.now();
  const pts = [];
  for (let w = weeks; w >= 0; w--) { const t = now - w * 7 * DAY; pts.push(S.customers.filter(c => c.first <= t).length); }
  const min = Math.floor(Math.min(...pts) * .9 / 5) * 5, max = Math.ceil(Math.max(...pts) / 5) * 5 || 5;
  const x = i => pl + i * (W - pl - pr) / weeks, y = v => pt + (1 - (v - min) / (max - min || 1)) * (H - pt - pb);
  const line = pts.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const ticks = [0, 1, 2, 3].map(i => Math.round(min + (max - min) * i / 3));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Database grew from ${pts[0]} to ${pts[weeks]}">
    <g class="grid">${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join("")}</g>
    <path d="${line}L${x(weeks)},${H - pb}L${x(0)},${H - pb}Z" fill="var(--accent)" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(weeks)}" cy="${y(pts[weeks])}" r="5" fill="var(--accent)"/>
    <text x="${x(weeks) - 8}" y="${y(pts[weeks]) - 10}" text-anchor="end" style="fill:var(--fg);font-weight:700">${pts[weeks]}</text>
    ${[0, 4, 8, 12].map(i => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${i === 12 ? "Now" : "−" + (12 - i) + "w"}</text>`).join("")}
  </svg>`;
}

  S.customers.unshift(c); return c;
}

function say(text) {
  S.chat.msgs.push({ who: "me", text });
  S.chat.msgs.push({ who: "bot", text: botReply(text) });
  save(); render();
}
function botReply(t) {
  const p = P(), low = t.toLowerCase(), c = S.chat;
  if (c.step === "when") { c.data.when = t; c.step = "name"; return "Perfect. What name should I put it under?"; }
  if (c.step === "name") { c.data.name = t; c.step = "phone"; return `Thanks ${t.split(" ")[0]}! And a phone number for the reminder?`; }
  if (c.step === "phone") {
    const cust = addCustomer(c.data.name, t, "AI chat (" + c.chan + ")"), when = c.data.when; S.bookings++;
    log("crm", `New ${p.bookingWord} from the AI chat on ${c.chan}: ${cust.name}, ${when}`);
    c.step = null; c.data = {};
    return `Done! ${cust.name.split(" ")[0]}, you're booked for ${when}. You'll get a reminder 24 hours before. See you soon!`;
  }
  if (/book|reserv|appointment|table|call|prenot/.test(low)) { c.step = "when"; return `Happy to book your ${p.bookingWord}. What day and time work for you?`; }
  const f = p.faqs.find(f => f.k.some(k => low.includes(k)));
  if (f) return f.a + `\n\nWould you like to book a ${p.bookingWord}?`;
  if (/hi|hello|ciao|hey/.test(low)) return `Hi! Ask me anything about ${S.brand.name}, or say "book" to make a ${p.bookingWord}.`;
  log("crm", `AI chat passed a question to the team: "${t.slice(0, 60)}"`);
  return "Good question. I've passed it to the team and someone will reply here shortly. Can I help with anything else meanwhile?";
}

function ratingStats() {
  const h = { ...S.history }; S.reviews.forEach(r => (h[r.stars] = (h[r.stars] || 0) + 1));
  const total = Object.values(h).reduce((a, b) => a + b, 0);
  const avg = Object.entries(h).reduce((a, [s, n]) => a + s * n, 0) / (total || 1);
  return { h, total, avg };
}
function replyFor(r, biz) {
  const first = r.name.split(" ")[0];
  if (r.stars >= 4) return `Thank you so much, ${first}! We're really glad you enjoyed it. See you again soon at ${biz}.`;
  if (r.stars === 3) return `Thanks for the honest feedback, ${first}. We're working on exactly this, and we'd love the chance to give you a 5-star experience next time.`;
  return `${first}, we're sorry, this isn't the experience we want for anyone. We'd like to make it right: please message us and the manager will contact you personally. – ${biz}`;
}

AFTER.inventory = () => {
  $("#moveForm").addEventListener("submit", e => {
    e.preventDefault();
    const it = S.inventory.find(i => i.sku === $("#mv-sku").value), qty = Math.floor(+$("#mv-qty").value), err = $("#mv-err");
    if (!(qty > 0)) { err.textContent = "Enter a quantity of 1 or more."; err.hidden = false; return; }
    if (ui.moveType !== "in" && qty > it.qty) { err.textContent = `Only ${it.qty} ${it.unit} in stock. Check the quantity, or record the delivery first.`; err.hidden = false; return; }
    const wasLow = it.qty <= it.min;
    it.qty += ui.moveType === "in" ? qty : -qty;
    S.moves.unshift({ at: Date.now(), sku: it.sku, type: ui.moveType, qty, by: $("#mv-by").value, note: $("#mv-note").value.trim() });
    log("inv", `${qty} ${it.unit} ${it.name}: ${P().movement[ui.moveType].toLowerCase()}`);
    if (!wasLow && it.qty <= it.min) { log("inv", `Low stock: ${it.name} (${it.qty} left). Purchase order drafted.`); S.autos.restock.sent++; S.autos.restock.converted++; }
    save(); toast("Movement saved"); render();
  });
};

      <p class="muted">Restore the sample ${p.customerWord}, reviews and stock for the ${esc(p.label.toLowerCase())} demo. Your changes to this demo are lost.</p>
      <div>${ui.confirmReset ? `<span class="inline-confirm">Reset this demo? <button class="btn small danger" type="button" id="resetYes">Yes, reset</button><button class="btn small" type="button" id="resetNo">Cancel</button></span>` : `<button class="btn danger" type="button" id="resetAsk">Reset demo data</button>`}</div>
      <h3 style="margin-top:8px">Saved in this browser</h3>
      <p class="muted" style="font-size:.88rem">Everything you do here is stored on this device only. Nothing is sent anywhere.</p>
    </div>
  </div>`;
};
AFTER.settings = () => {
  $("#brandForm").addEventListener("submit", e => {
    e.preventDefault();
    S.brand.name = $("#st-name").value.trim() || P().name;
    S.brand.domain = $("#st-domain").value.trim() || P().domain;
    S.brand.accent = $("#st-accent").value;
    save(); toast("Branding applied"); render();
  });
};

/* ===================== Events (delegated) ===================== */
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { toast("Copy blocked by the browser. Select the text and copy it manually."); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("button, [data-tier], tr[data-cust]"); if (!b) return;
  const d = b.dataset;
  if (d.tab) { tab = d.tab; ui.po = null; ui.confirmReset = false; render(); window.scrollTo(0, 0); return; }
  if (d.chan) { S.chat.chan = d.chan; save(); render(); return; }
  if (d.say) { say(d.say); return; }
  if (b.id === "chatReset") { S.chat = null; save(); render(); return; }
  if (d.seg) { ui.seg = d.seg; render(); return; }
  if (d.cust) { ui.sel = d.cust; render(); return; }
  if (b.id === "exportCsv") { copy(["id,name,phone,email,segment,visits,spend,last_visit,source", ...S.customers.map(c => [c.id, c.name, c.phone, c.email, segment(c), c.visits, c.spend, new Date(c.last).toISOString().slice(0, 10), c.source].map(v => `"${String(v).replace(/"/g, '""')}"`).join(","))].join("\n")); return; }
  const c = S.customers.find(x => x.id === ui.sel);
  if (b.id === "saveNotes" && c) { c.notes = $("#custNotes").value; save(); toast("Notes saved"); return; }
  if (b.id === "logVisit" && c) { c.visits++; c.spend += P().avgTicket; c.last = Date.now(); log("crm", `Visit logged for ${c.name}`); save(); render(); return; }
  if (b.id === "sendMsg" && c) { const wb = segment(c) === "At risk"; log("auto", `${wb ? "Win-back offer" : "Review request"} sent to ${c.name}`); S.autos[wb ? "winback" : "reviews"].sent++; save(); toast(`${wb ? "Win-back offer" : "Review request"} queued for ${c.name} (demo, nothing is sent)`); render(); return; }
  if (b.id === "sendReq") { const n = S.customers.filter(x => Date.now() - x.last < 7 * DAY).length; S.autos.reviews.sent += n; log("rev", `Review requests sent to ${n} recent ${P().customerWord}`); save(); toast(`${n} review requests queued (demo)`); render(); return; }
  if (d.draft) { const r = S.reviews.find(x => x.id === d.draft); r.draft = replyFor(r, S.brand.name); save(); render(); return; }
  if (d.publish) { const r = S.reviews.find(x => x.id === d.publish); r.reply = $("#draft-" + r.id).value.trim(); delete r.draft; log("rev", `Reply published to ${r.name}'s review`); save(); render(); return; }
  if (d.discard) { const r = S.reviews.find(x => x.id === d.discard); delete r.draft; save(); render(); return; }
  if (d.run) { const a = AUTOMATIONS.find(x => x.id === d.run), n = audienceCount(a), st = S.autos[a.id], conv = Math.max(1, Math.round(n * a.rate)); st.sent += n; st.converted += conv; log("auto", `${fill(a.name, P())}: sent to ${n}, ${conv} ${a.metric}`); save(); toast(`${fill(a.name, P())} ran for ${n}`); render(); return; }
  if (d.mtype) { ui.moveType = d.mtype; render(); return; }
  if (d.po) { ui.po = draftPO(S.inventory.find(i => i.sku === d.po)); render(); return; }
  if (b.id === "copyPo") { copy(ui.po); return; }
  if (d.tier) { S.tier = d.tier; save(); render(); return; }
  if (b.id === "copyQuote") { copy(quoteText()); return; }
  if (b.id === "resetAsk") { ui.confirmReset = true; render(); return; }
  if (b.id === "resetNo") { ui.confirmReset = false; render(); return; }
  if (b.id === "resetYes") { store.del("demo:" + presetKey); S = seedState(presetKey); ui.confirmReset = false; ui.sel = null; toast("Demo data reset"); save(); render(); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "presetSelect") { presetKey = t.value; store.set("demo:preset", presetKey); S = load(presetKey); ui.sel = null; ui.po = null; ui.seg = "All"; ui.q = ""; render(); return; }
  if (t.dataset.auto) { S.autos[t.dataset.auto].on = t.checked; log("auto", `${fill(AUTOMATIONS.find(a => a.id === t.dataset.auto).name, P())} turned ${t.checked ? "on" : "off"}`); save(); render(); return; }
  if (t.dataset.addon) { S.addons = t.checked ? [...new Set([...S.addons, t.dataset.addon])] : S.addons.filter(x => x !== t.dataset.addon); save(); render(); return; }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-cust], [data-tier]")) { e.preventDefault(); e.target.click(); }
});

/* ===================== Boot ===================== */
const h = (location.hash || "").slice(1);
if (TABS.some(([id]) => id === h)) tab = h;
render();
</script>
