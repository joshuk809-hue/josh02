<style>
/* Layout: fixed sidebar (brand, navigation, business switcher) + one working module at a time.
   Every size is in rem and the root font size grows with the screen, so the interface stays crisp and proportional up to 4K.
   Each business type is its own visual world, chosen with html[data-biz]:
   restaurant = trattoria (bottle green, tomato red, gingham), salon = beauty studio (blush, mauve, soft light),
   shop = bottega (kraft paper, navy, price-tag orange), agency = studio (night blue, electric violet, dot grid). */
:root {
  --bg: #fbf7ef; --surface: #ffffff; --surface-2: #f3ecdf;
  --ink: #2a2118; --ink-2: #5a4c3e; --muted: #857664; --line: #e6dccb;
  --accent: #c2412d; --on-accent: #ffffff; --accent-2: #1f4d3a;
  --side-bg: #1f4d3a; --side-ink: #f6efe2; --side-muted: #a9c2b3; --side-active: rgba(255,255,255,.13); --side-line: rgba(255,255,255,.14);
  --star: #d9921a;
  --good: #2b7a46; --good-soft: #e0f0e4; --warn: #94600c; --warn-soft: #f8ebd0;
  --bad: #b3372a; --bad-soft: #f9e0db; --info: #2f5f99; --info-soft: #e0e9f5;
  --display: "DM Serif Display", Georgia, serif; --display-weight: 400; --display-case: none; --display-track: -.005em;
  --body: "Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: .45rem; --r-lg: .7rem;
  --shadow: 0 .06rem .15rem rgba(42,33,24,.06), 0 .6rem 1.6rem rgba(42,33,24,.07);
  --hero-pattern:
    repeating-linear-gradient(0deg, rgba(194,65,45,.38) 0 .75rem, transparent .75rem 1.5rem),
    repeating-linear-gradient(90deg, rgba(194,65,45,.38) 0 .75rem, transparent .75rem 1.5rem);
  --hero-bg: #fffaf3;
  --side-pattern: none;
  color-scheme: light;
}
html[data-biz="salon"] {
  --bg: #fbf3f1; --surface: #fffdfc; --surface-2: #f6e9e6;
  --ink: #36202c; --ink-2: #67505c; --muted: #977f8b; --line: #eddcd8;
  --accent: #a24f66; --on-accent: #ffffff; --accent-2: #b98a5c;
  --side-bg: #fff8f6; --side-ink: #36202c; --side-muted: #977f8b; --side-active: #f4dfdc; --side-line: #eddcd8;
  --star: #b98a5c;
  --display: "Italiana", "Didot", Georgia, serif; --display-weight: 400; --display-case: none; --display-track: .01em;
  --body: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 1.1rem; --r-lg: 1.6rem;
  --shadow: 0 .1rem .3rem rgba(54,32,44,.05), 0 1rem 2.4rem rgba(162,79,102,.09);
  --hero-pattern:
    radial-gradient(40% 70% at 85% 30%, rgba(162,79,102,.28), transparent 70%),
    radial-gradient(35% 60% at 65% 90%, rgba(185,138,92,.30), transparent 70%),
    radial-gradient(30% 50% at 98% 95%, rgba(255,255,255,.9), transparent 70%);
  --hero-bg: #fdf0ee;
  --side-pattern: radial-gradient(80% 30% at 0% 100%, rgba(162,79,102,.12), transparent 70%);
  color-scheme: light;
}
html[data-biz="shop"] {
  --bg: #ece3d1; --surface: #fbf8f1; --surface-2: #e5dac5;
  --ink: #221f1b; --ink-2: #4b443a; --muted: #776e60; --line: #cdbfa6;
  --accent: #bd551b; --on-accent: #ffffff; --accent-2: #23395b;
  --side-bg: #23395b; --side-ink: #f4efe4; --side-muted: #a9b5c9; --side-active: rgba(255,255,255,.13); --side-line: rgba(255,255,255,.15);
  --star: #bd551b;
  --display: "Archivo Narrow", "Arial Narrow", sans-serif; --display-weight: 700; --display-case: uppercase; --display-track: .03em;
  --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: .15rem; --r-lg: .2rem;
  --shadow: .2rem .2rem 0 rgba(34,31,27,.12);
  --hero-pattern:
    repeating-linear-gradient(-45deg, rgba(189,85,27,.85) 0 1.1rem, rgba(251,248,241,.0) 1.1rem 2.2rem);
  --hero-bg: #f6efe1;
  --side-pattern: repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 6px);
  color-scheme: light;
}
html[data-biz="agency"] {
  --bg: #0c0e17; --surface: #151927; --surface-2: #1d2236;
  --ink: #eef0ff; --ink-2: #bcc1dc; --muted: #8088aa; --line: #272d47;
  --accent: #7c6cff; --on-accent: #ffffff; --accent-2: #ff6fa0;
  --side-bg: #10131f; --side-ink: #eef0ff; --side-muted: #8088aa; --side-active: rgba(124,108,255,.2); --side-line: #232842;
  --star: #ffc65c;
  --good: #52d48e; --good-soft: #15301f; --warn: #f0b85a; --warn-soft: #3a2d14;
  --bad: #ff8577; --bad-soft: #3e1d1b; --info: #8cb5ff; --info-soft: #1a2945;
  --display: "Unbounded", "Arial Black", sans-serif; --display-weight: 700; --display-case: none; --display-track: -.02em;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: .7rem; --r-lg: 1rem;
  --shadow: 0 0 0 1px rgba(124,108,255,.06), 0 1rem 2.4rem rgba(0,0,0,.35);
  --hero-pattern:
    radial-gradient(45% 80% at 90% 10%, rgba(124,108,255,.55), transparent 70%),
    radial-gradient(35% 70% at 70% 100%, rgba(255,111,160,.38), transparent 70%),
    radial-gradient(circle, rgba(255,255,255,.12) 1px, transparent 1.4px) 0 0 / 1.1rem 1.1rem;
  --hero-bg: #13172a;
  --side-pattern: radial-gradient(circle, rgba(255,255,255,.05) 1px, transparent 1.4px) 0 0 / 1rem 1rem;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { font-size: clamp(15px, .35vw + 10px, 24px); }
body { background: var(--bg); color: var(--ink); font: 1rem/1.55 var(--body); margin: 0; transition: background .3s, color .3s; }
h1, h2, h3, .display { font-family: var(--display); font-weight: var(--display-weight); text-transform: var(--display-case); letter-spacing: var(--display-track); line-height: 1.12; margin: 0; text-wrap: balance; }
h1 { font-size: 2.3rem; } h2 { font-size: 1.65rem; } h3 { font-size: 1.12rem; }
html[data-biz="salon"] h1 { font-size: 2.8rem; } html[data-biz="salon"] h2 { font-size: 2rem; } html[data-biz="salon"] h3 { font-size: 1.35rem; }
html[data-biz="agency"] h1 { font-size: 2rem; } html[data-biz="agency"] h2 { font-size: 1.4rem; } html[data-biz="agency"] h3 { font-size: 1rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
svg { flex: none; }
:focus-visible { outline: .14rem solid var(--accent); outline-offset: .14rem; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: .85em; }
.muted { color: var(--muted); }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.ico { width: 1.25rem; height: 1.25rem; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* App frame */
.app { display: grid; grid-template-columns: 17rem minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side-bg); background-image: var(--side-pattern); color: var(--side-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 1.4rem; padding: 1.5rem 1rem; border-right: 1px solid var(--side-line); }
.brand { display: flex; gap: .75rem; align-items: center; padding-inline: .5rem; }
.logo { width: 2.6rem; height: 2.6rem; border-radius: var(--r); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--display); font-size: 1.25rem; flex: none; }
.brand-name { font-family: var(--display); font-weight: var(--display-weight); text-transform: var(--display-case); letter-spacing: var(--display-track); font-size: 1.12rem; line-height: 1.15; overflow-wrap: anywhere; }
.brand-sub { font-size: .76rem; color: var(--side-muted); }
.nav { display: grid; gap: .2rem; }
.nav button { display: flex; align-items: center; gap: .75rem; width: 100%; padding: .7rem .8rem; border: 0; border-radius: var(--r); background: none; color: var(--side-ink); font-weight: 600; font-size: .95rem; text-align: left; cursor: pointer; opacity: .82; }
.nav button:hover { background: var(--side-active); opacity: 1; }
.nav button[aria-current="page"] { background: var(--side-active); opacity: 1; box-shadow: inset .2rem 0 0 var(--accent); }
.nav .badge { margin-left: auto; background: var(--accent); color: var(--on-accent); border-radius: 999px; font-size: .7rem; padding: .05rem .5rem; font-weight: 700; }
.side-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--side-muted); font-weight: 600; padding-inline: .5rem; margin-bottom: .5rem; }
.biz-switch { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; margin-top: auto; }
.biz-switch button { display: grid; justify-items: start; gap: .3rem; padding: .65rem .7rem; border-radius: var(--r); border: 1px solid var(--side-line); background: none; color: var(--side-ink); font-size: .78rem; font-weight: 600; cursor: pointer; text-align: left; }
.biz-switch button:hover { background: var(--side-active); }
.biz-switch button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.powered { font-size: .72rem; color: var(--side-muted); padding-inline: .5rem; }

main { padding: 2rem 2.4rem 4rem; display: grid; gap: 1.5rem; align-content: start; max-width: 128rem; width: 100%; margin-inline: auto; }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; padding: 1rem; gap: .9rem; border-right: 0; border-bottom: 1px solid var(--side-line); }
  .nav { display: flex; overflow-x: auto; gap: .3rem; scrollbar-width: none; margin-inline: -1rem; padding-inline: 1rem; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { width: auto; white-space: nowrap; padding: .55rem .8rem; }
  .nav button[aria-current="page"] { box-shadow: inset 0 -.18rem 0 var(--accent); }
  .biz-switch { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 0; }
  .biz-switch button { justify-items: center; text-align: center; font-size: .7rem; padding: .5rem .3rem; }
  .side-label.biz, .powered { display: none; }
  main { padding: 1.4rem 1rem 3rem; }
  h1 { font-size: 1.8rem; } html[data-biz="salon"] h1 { font-size: 2.1rem; } html[data-biz="agency"] h1 { font-size: 1.45rem; }
}

/* Controls */
.btn { border: 1px solid var(--line); background: var(--surface); padding: .6rem 1rem; border-radius: var(--r); font-weight: 600; font-size: .9rem; cursor: pointer; display: inline-flex; gap: .5rem; align-items: center; justify-content: center; min-height: 2.6rem; transition: transform .12s, filter .12s, border-color .12s; }
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: .35rem .75rem; font-size: .82rem; min-height: 2.1rem; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn .ico { width: 1.05rem; height: 1.05rem; }
input[type=text], input[type=number], input[type=tel], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .6rem .8rem; width: 100%; min-width: 0; min-height: 2.6rem; }
textarea { resize: vertical; min-height: 5rem; }
label.field, div.field { display: grid; gap: .35rem; font-size: .84rem; font-weight: 600; color: var(--ink-2); }
.row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 1.3rem; min-width: 0; box-shadow: var(--shadow); }
html[data-biz="shop"] .panel { border-color: var(--ink); }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: .8rem; margin-bottom: 1rem; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 1.5rem; }
.grid-2.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1100px) { .grid-2, .grid-2.even { grid-template-columns: minmax(0, 1fr); } }

/* Page header */
.page-head { display: flex; justify-content: space-between; align-items: end; gap: 1rem; flex-wrap: wrap; }
.page-head p { color: var(--ink-2); max-width: 60ch; margin-top: .4rem; }
.hint { display: flex; gap: .6rem; align-items: flex-start; background: var(--surface-2); border-radius: var(--r); padding: .7rem .9rem; font-size: .88rem; color: var(--ink-2); max-width: 70ch; }
.hint .ico { color: var(--accent); margin-top: .1rem; }

/* Hero */
.hero { position: relative; overflow: hidden; border-radius: var(--r-lg); background: var(--hero-bg); border: 1px solid var(--line); padding: 2rem 2.2rem; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1.5rem; align-items: center; box-shadow: var(--shadow); }
html[data-biz="shop"] .hero { border-color: var(--ink); }
.hero::after { content: ""; position: absolute; inset: 0 0 0 auto; width: 38%; background: var(--hero-pattern); pointer-events: none; -webkit-mask-image: linear-gradient(90deg, transparent, #000 45%); mask-image: linear-gradient(90deg, transparent, #000 45%); }
html[data-biz="shop"] .hero::after { -webkit-mask-image: none; mask-image: none; width: 1.4rem; opacity: .9; }
html[data-biz="restaurant"] .hero::after { width: 100%; top: auto; height: .9rem; -webkit-mask-image: none; mask-image: none; }
.hero-text { position: relative; z-index: 1; display: grid; gap: .7rem; }
.hero-text p { color: var(--ink-2); max-width: 52ch; font-size: 1.05rem; }
.hero-art { position: relative; z-index: 1; width: 8.5rem; height: 8.5rem; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--accent); border: 1px solid var(--line); box-shadow: var(--shadow); }
.hero-art .ico { width: 4rem; height: 4rem; stroke-width: 1.3; }
html[data-biz="shop"] .hero-art { border-radius: var(--r); border: 2px dashed var(--ink); transform: rotate(-4deg); margin-right: 1.4rem; }
html[data-biz="agency"] .hero-art { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: 0; }
@media (max-width: 700px) { .hero { grid-template-columns: 1fr; padding: 1.4rem; } .hero-art { display: none; } }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(11.5rem, 1fr)); gap: 1rem; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 1rem 1.15rem; display: grid; gap: .15rem; box-shadow: var(--shadow); align-content: start; }
html[data-biz="shop"] .kpi { border-color: var(--ink); }
.kpi .v { font-family: var(--display); font-weight: var(--display-weight); font-size: 1.9rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
html[data-biz="salon"] .kpi .v, html[data-biz="salon"] .big-rating .v { font-family: var(--body); font-weight: 300; font-size: 2.1rem; letter-spacing: -.01em; }
html[data-biz="salon"] .big-rating .v { font-size: 3rem; }
html[data-biz="agency"] .kpi .v { font-size: 1.55rem; }
.kpi .d { font-size: .82rem; color: var(--muted); }
.up { color: var(--good); } .down { color: var(--bad); }

.pill { display: inline-block; padding: .12rem .6rem; border-radius: 999px; font-size: .75rem; font-weight: 600; white-space: nowrap; }
html[data-biz="shop"] .pill { border-radius: .15rem; text-transform: uppercase; letter-spacing: .04em; font-size: .68rem; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.plain { background: var(--surface-2); color: var(--ink-2); }

/* To-do */
.todo { display: grid; gap: .6rem; }
.todo-item { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr) auto; gap: .8rem; align-items: center; padding: .7rem .8rem; border-radius: var(--r); background: var(--surface-2); }
.todo-ico { width: 2.4rem; height: 2.4rem; border-radius: var(--r); display: grid; place-items: center; background: var(--surface); color: var(--accent); }
.todo-item b { display: block; }
.todo-item span.muted { font-size: .84rem; }
@media (max-width: 520px) { .todo-item { grid-template-columns: 2.4rem minmax(0, 1fr); } .todo-item .btn { grid-column: 1 / -1; } }

.feed { display: grid; gap: .75rem; max-height: 22rem; overflow-y: auto; }
.feed-item { display: grid; grid-template-columns: .55rem minmax(0, 1fr) auto; gap: .7rem; align-items: baseline; font-size: .9rem; }
.dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--accent); transform: translateY(-.05rem); }
.dot.inv { background: var(--warn); } .dot.rev { background: var(--star); } .dot.crm { background: var(--good); } .dot.auto { background: var(--accent-2); }

.chart svg { width: 100%; height: auto; display: block; }
.chart .grid line { stroke: var(--line); }
.chart text { fill: var(--muted); font-family: var(--body); font-size: 11px; }

/* Chat */
.chat { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 36rem; max-height: 75vh; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; box-shadow: var(--shadow); }
.chat-head { padding: .8rem 1rem; border-bottom: 1px solid var(--line); display: flex; gap: .7rem; align-items: center; flex-wrap: wrap; }
.chat-head .logo { width: 2.1rem; height: 2.1rem; font-size: 1rem; }
.online { font-size: .76rem; color: var(--good); display: flex; align-items: center; gap: .3rem; }
.online::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: var(--good); }
.chan { display: flex; gap: .3rem; margin-left: auto; }
.chan button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: .25rem .75rem; font-size: .78rem; cursor: pointer; }
.chan button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.msgs { padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: .55rem; background: var(--bg); }
.msg { max-width: 80%; padding: .6rem .9rem; border-radius: 1rem; font-size: .93rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bot { background: var(--surface); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: .3rem; }
.msg.me { background: var(--accent); color: var(--on-accent); align-self: flex-end; border-bottom-right-radius: .3rem; }
.msg-time { font-size: .68rem; opacity: .6; display: block; margin-top: .2rem; }
.chat form { display: flex; gap: .5rem; padding: .7rem; border-top: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: .45rem; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: .4rem .85rem; font-size: .85rem; cursor: pointer; color: var(--ink); text-align: left; }
.chip:hover { border-color: var(--accent); }
.faq-list { margin: .4rem 0 0; padding: 0; list-style: none; display: grid; gap: .5rem; font-size: .88rem; color: var(--ink-2); }
.faq-list li { padding-left: .9rem; border-left: .15rem solid var(--line); }

/* CRM */
.filters { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.search { position: relative; flex: 1 1 14rem; max-width: 22rem; }
.search .ico { position: absolute; left: .7rem; top: 50%; transform: translateY(-50%); color: var(--muted); width: 1.05rem; height: 1.05rem; }
.search input { padding-left: 2.3rem; }
.seg { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: .4rem .9rem; font-size: .85rem; font-weight: 600; cursor: pointer; min-height: 2.3rem; }
.seg[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg[aria-pressed="true"] .muted { color: inherit; opacity: .7; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: .65rem .8rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: .7rem .8rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td, tr.selected td { background: var(--surface-2); }

const cur = n => { const d = n % 1 ? 2 : 0; return CONFIG.currency + " " + Number(n).toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d }); };

const DAY = 86400000;
function ago(ts) {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "adesso"; if (m < 60) return m + " min fa";
  if (m < 1440) return Math.round(m / 60) + " h fa";
  const d = Math.round(m / 1440); return d === 1 ? "ieri" : d + " g fa";
}
const hhmm = ts => new Date(ts).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const store = {

};

const LAST = ["Rossi","Bianchi","Ferrari","Romano","Colombo","Greco","Conti","Marino","Costa","Bruno","Gallo","Rinaldi","Moretti","Barbieri","Lombardi","Fontana","Ricci","Esposito","Villa","Caruso"];
const SOURCES = ["Sito web", "Google", "Instagram", "Passaparola", "WhatsApp", "Assistente AI", "In negozio"];

function seedState(key) {
  const p = CONFIG.presets[key];
  const r = rng(key.split("").reduce((a, c) => a + c.charCodeAt(0), 7) * 97);
  const now = Date.now();
  const customers = [];
  for (let i = 0; i < 64; i++) {
    // più clienti recenti: il database cresce gradualmente
    const firstDays = Math.round(Math.pow(r(), 1.6) * 360);
    const visits = 1 + Math.floor(Math.pow(r(), 2) * 18);
    const lastDays = Math.min(firstDays, Math.round(r() < .25 ? 45 + r() * 80 : r() * 40));
    const fn = FIRST[Math.floor(r() * FIRST.length)], ln = LAST[Math.floor(r() * LAST.length)];
    customers.push({
      id: "C" + (1001 + i), name: fn + " " + ln,
      phone: "+39 3" + Math.floor(10 + r() * 89) + " " + Math.floor(100000 + r() * 899999),
      email: (fn + "." + ln).toLowerCase() + "@email.it",
      first: now - firstDays * DAY, last: now - lastDays * DAY, visits,
      spend: Math.round(visits * p.avgTicket * (.7 + r() * .7)),
      source: SOURCES[Math.floor(r() * SOURCES.length)], birthdaySoon: r() < .06, notes: ""
    });
  }
  const reviews = p.reviews.map(([stars, name, text], i) => ({ id: "R" + i, stars, name, text, at: now - (i * 4 + 1) * DAY, reply: i % 2 === 1 ? replyFor({ stars, name }, p.name) : "" }));
  const inventory = p.inventory.map(([sku, name, unit, qty, min, cost, supplier]) => ({ sku, name, unit, qty, min, cost, supplier }));
  const moves = inventory.slice(0, 5).map((it, i) => ({ at: now - (i + 1) * 9 * 3600000, sku: it.sku, type: i % 2 ? "out" : "in", qty: i % 2 ? 2 : Math.max(2, Math.round(it.min / 2)), by: ["Marta", "Luca", "Titolare"][i % 3], note: i % 2 ? "" : "DDT n. " + (240 + i) }));
  const autos = {};
  AUTOMATIONS.forEach((a, i) => { const sent = Math.round(40 + r() * 260); autos[a.id] = { on: i !== 5, sent, converted: Math.round(sent * a.rate) }; });
  const feed = [
    { at: now - 25 * 60000, kind: "crm", text: `${p.bookingNew} dall'assistente AI: ${customers[3].name}` },
    { at: now - 2 * 3600000, kind: "rev", text: `Nuova recensione a 5 stelle da ${p.reviews[0][1]}` },
    { at: now - 5 * 3600000, kind: "auto", text: `Recupero inviato a 9 ${p.people} a rischio` },
    { at: now - 9 * 3600000, kind: "inv", text: `${inventory[0].name}: ${p.movement.in.toLowerCase()} (+${moves[0].qty} ${inventory[0].unit})` }
  ];
  return { brand: { name: p.name, accent: p.accent }, customers, reviews, history: { 5: 58, 4: 21, 3: 6, 2: 3, 1: 2 }, inventory, moves, autos, feed, bookings: Math.round(40 + r() * 60), missed: Math.round(6 + r() * 10), chat: null };
}

function growthChart() {
  const W = 640, H = 240, pl = 40, pr = 16, pt = 22, pb = 30, weeks = 12, now = Date.now();
  const pts = [];
  for (let w = weeks; w >= 0; w--) { const t = now - w * 7 * DAY; pts.push(S.customers.filter(c => c.first <= t).length); }
  const min = Math.floor(Math.min(...pts) * .9 / 5) * 5, max = Math.ceil(Math.max(...pts) / 5) * 5 || 5;
  const x = i => pl + i * (W - pl - pr) / weeks, y = v => pt + (1 - (v - min) / (max - min || 1)) * (H - pt - pb);
  const line = pts.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const ticks = [0, 1, 2, 3].map(i => Math.round(min + (max - min) * i / 3));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Il database è passato da ${pts[0]} a ${pts[weeks]}">
    <defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <g class="grid">${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join("")}</g>
    <path d="${line}L${x(weeks)},${H - pb}L${x(0)},${H - pb}Z" fill="url(#gArea)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(weeks)}" cy="${y(pts[weeks])}" r="5.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${x(weeks) - 10}" y="${y(pts[weeks]) - 10}" text-anchor="end" style="fill:var(--ink);font-weight:700;font-size:13px">${pts[weeks]}</text>
    ${[0, 4, 8, 12].map(i => `<text x="${x(i)}" y="${H - 9}" text-anchor="middle">${i === 12 ? "Oggi" : "−" + (12 - i) + " sett."}</text>`).join("")}
  </svg>`;
}

function addCustomer(name, phone, source) {
  const ex = S.customers.find(c => c.phone && c.phone.replace(/\s/g, "") === phone.replace(/\s/g, ""));
  if (ex) { ex.visits++; ex.last = Date.now(); return ex; }
  const c = { id: "C" + (1001 + S.customers.length), name, phone, email: "", first: Date.now(), last: Date.now(), visits: 1, spend: 0, source, birthdaySoon: false, notes: "" };
  S.customers.unshift(c); return c;
}

function botReply(t) {
  const p = P(), low = t.toLowerCase(), c = S.chat;
  if (c.step === "when") { c.data.when = t; c.step = "name"; return "Perfetto. A che nome registro?"; }
  if (c.step === "name") { c.data.name = t; c.step = "phone"; return `Grazie ${t.split(" ")[0]}! Mi lasci un numero di telefono per il promemoria?`; }
  if (c.step === "phone") {
    const cust = addCustomer(c.data.name, t, "Assistente AI (" + c.chan + ")"), when = c.data.when; S.bookings++;
    log("crm", `${p.bookingNew} dall'assistente AI su ${c.chan}: ${cust.name}, ${when}`);
    c.step = null; c.data = {};
    return `Fatto! ${cust.name.split(" ")[0]}, ti aspettiamo: ${when}. Riceverai un promemoria 24 ore prima. A presto!`;
  }
  if (/prenot|appunt|tavolo|call|fissa|riserv/.test(low)) { c.step = "when"; return "Con piacere! Per quale giorno e ora?"; }
  const f = p.faqs.find(f => f.k.some(k => low.includes(k)));
  if (f) return f.a + `\n\nVuoi che ti fissi ${p.bookingOne}?`;
  if (/^(ciao|salve|buon|hey|hello)/.test(low)) return `Ciao! Chiedimi qualsiasi cosa su ${S.brand.name}, oppure scrivi "prenota".`;
  if (/^(sì|si|ok|certo|volentieri)\b/.test(low)) { c.step = "when"; return "Ottimo! Per quale giorno e ora?"; }
  log("crm", `L'assistente ha passato una domanda allo staff: "${t.slice(0, 60)}"`);
  return "Bella domanda! L'ho girata allo staff, ti rispondono qui a breve. Posso aiutarti con altro nel frattempo?";
}

/* ---- Recensioni ---- */
function ratingStats() {
  const h = { ...S.history }; S.reviews.forEach(r => (h[r.stars] = (h[r.stars] || 0) + 1));
  const total = Object.values(h).reduce((a, b) => a + b, 0);
  return { h, total, avg: Object.entries(h).reduce((a, [s, n]) => a + s * n, 0) / (total || 1) };
}
function replyFor(r, biz) {
  const first = r.name.split(" ")[0];
  if (r.stars >= 4) return `Grazie di cuore, ${first}! Siamo felici che ti sia piaciuto. Ti aspettiamo presto da ${biz}.`;
  if (r.stars === 3) return `Grazie per il commento sincero, ${first}. Ci stiamo lavorando proprio ora e ci piacerebbe offrirti un'esperienza da 5 stelle la prossima volta.`;
  return `${first}, ci dispiace davvero: non è l'esperienza che vogliamo offrire. Vorremmo rimediare: scrivici e il responsabile ti contatterà personalmente. – ${biz}`;
}

/* ---- Automazioni ---- */
function audienceCount(a) {
  const cs = S.customers;
  return { recent: cs.filter(c => Date.now() - c.last < 7 * DAY).length, missed: S.missed, bookings: S.bookings, atrisk: cs.filter(c => segment(c) === "A rischio").length,
    new: cs.filter(c => segment(c) === "Nuovo").length, birthday: cs.filter(c => c.birthdaySoon).length, lowstock: lowItems().length }[a.audience] || 0;
}
function runAuto(id) {
  const a = AUTOMATIONS.find(x => x.id === id), n = audienceCount(a), st = S.autos[id];
  if (!n || !st.on) return;
  const conv = Math.max(1, Math.round(n * a.rate)); st.sent += n; st.converted += conv;
  log("auto", `${fill(a.name, P())}: inviato a ${n}, ${conv} ${a.metric}`);
  save(); toast(`${fill(a.name, P())}: inviato a ${n} (demo, nessun messaggio reale)`); render();
}

/* ===================== Eventi ===================== */
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copiato"); }
  catch { toast("Il browser ha bloccato la copia. Seleziona il testo e copialo a mano."); }
}
function switchBiz(k) { presetKey = k; store.set("demo-it:preset", k); S = load(k); Object.assign(ui, { sel: null, po: null, seg: "Tutti", q: "", sku: null, qty: 1, confirmReset: false }); render(); }
document.addEventListener("click", e => {
  const b = e.target.closest("button, tr[data-cust]"); if (!b) return;
  const d = b.dataset;
  if (d.tab) { tab = d.tab; ui.po = null; ui.confirmReset = false; render(); window.scrollTo(0, 0); return; }
  if (d.biz) { switchBiz(d.biz); return; }
  if (d.chan) { S.chat.chan = d.chan; save(); render(); return; }
  if (d.say) { say(d.say); return; }
  if (b.id === "chatReset") { S.chat = null; save(); render(); return; }
  if (d.seg) { ui.seg = d.seg; render(); return; }
  if (d.cust) { ui.sel = d.cust; render(); if (matchMedia("(max-width: 1100px)").matches) $("#profile").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (b.id === "exportCsv") { copy(["id,nome,telefono,email,gruppo,visite,speso,ultima_visita,fonte", ...S.customers.map(c => [c.id, c.name, c.phone, c.email, segment(c), c.visits, c.spend, new Date(c.last).toISOString().slice(0, 10), c.source].map(v => `"${String(v).replace(/"/g, '""')}"`).join(","))].join("\n")); return; }
  const c = S.customers.find(x => x.id === ui.sel);
  if (b.id === "saveNotes" && c) { c.notes = $("#custNotes").value; save(); toast("Note salvate"); return; }
  if (b.id === "logVisit" && c) { c.visits++; c.spend += P().avgTicket; c.last = Date.now(); log("crm", `Visita registrata per ${c.name}`); save(); render(); return; }
  if (b.id === "sendMsg" && c) { const wb = segment(c) === "A rischio"; log("auto", `${wb ? "Offerta di ritorno" : "Richiesta di recensione"} inviata a ${c.name}`); S.autos[wb ? "winback" : "reviews"].sent++; save(); toast(`${wb ? "Offerta" : "Richiesta"} in coda per ${c.name} (demo)`); render(); return; }
  if (b.id === "sendReq") { const n = S.customers.filter(x => Date.now() - x.last < 7 * DAY).length; S.autos.reviews.sent += n; log("rev", `Richieste di recensione inviate a ${n} ${P().people} recenti`); save(); toast(`${n} richieste di recensione in coda (demo)`); render(); return; }
  if (d.draft) { const r = S.reviews.find(x => x.id === d.draft); r.draft = replyFor(r, S.brand.name); save(); render(); return; }
  if (d.publish) { const r = S.reviews.find(x => x.id === d.publish); r.reply = $("#draft-" + r.id).value.trim(); delete r.draft; log("rev", `Risposta pubblicata alla recensione di ${r.name}`); save(); toast("Risposta pubblicata"); render(); return; }
  if (d.discard) { const r = S.reviews.find(x => x.id === d.discard); delete r.draft; save(); render(); return; }
  if (d.run) { runAuto(d.run); return; }
  if (d.mtype) { ui.moveType = d.mtype; render(); return; }
  if (d.step) { ui.qty = Math.max(1, (Math.floor(+$("#mv-qty").value) || 1) + +d.step); render(); return; }
  if (d.invtab) { ui.invTab = d.invtab; render(); return; }
  if (d.po) { ui.po = draftPO(S.inventory.find(i => i.sku === d.po)); render(); return; }
  if (b.id === "copyPo") { copy(ui.po); return; }
  if (d.color) { $("#st-accent").value = d.color; document.querySelectorAll(".swatch").forEach(s => s.setAttribute("aria-pressed", s === b)); document.documentElement.style.setProperty("--accent", d.color); return; }
  if (b.id === "resetAsk") { ui.confirmReset = true; render(); return; }
  if (b.id === "resetNo") { ui.confirmReset = false; render(); return; }
  if (b.id === "resetYes") { store.del("demo-it:" + presetKey); S = seedState(presetKey); Object.assign(ui, { confirmReset: false, sel: null, po: null, sku: null }); save(); toast("Dati demo ripristinati"); render(); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.auto) { S.autos[t.dataset.auto].on = t.checked; log("auto", `${fill(AUTOMATIONS.find(a => a.id === t.dataset.auto).name, P())}: ${t.checked ? "attivata" : "disattivata"}`); save(); render(); }
});
document.addEventListener("input", e => { if (e.target.id === "st-accent") document.documentElement.style.setProperty("--accent", e.target.value); });
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-cust]")) { e.preventDefault(); e.target.click(); }
});

/* ===================== Avvio ===================== */
const h0 = (location.hash || "").slice(1);
if (TABS.some(([id]) => id === h0)) tab = h0;
render();
</script>
