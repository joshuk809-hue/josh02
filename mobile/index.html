<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contadino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<!--ARTIFACT-START-->
<title>Contadino Club</title>
<meta name="art-base" content="../wallet/art/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f4f1e8;
  --surface: #fffdf7;
  --surface-2: #ece7da;
  --ink: #1b1e17;
  --ink-2: #4c5044;
  --muted: #787b6c;
  --line: #ded7c5;
  --brand: #21402f;
  --brand-ink: #f4f1e8;
  --gold: #9a7428;
  --gold-soft: #f1e5c3;
  --good: #2e7d4f;
  --good-soft: #dcefe2;
  --bad: #a83b2a;
  --bad-soft: #f5dcd6;
  --info: #3d5a80;
  --info-soft: #dde6f1;
  --bar: #3f6b4a;
  --stage: #d9d3c2;
  --shadow: 0 1px 2px rgba(27, 30, 23, .06), 0 10px 30px -10px rgba(27, 30, 23, .18);
  --t-germoglio: #21402f; --t-raccolto: #6b4424; --t-riserva: #0e0d0b;
  --display: "Cormorant Garamond", Garamond, Georgia, serif;
  --caps: "Cinzel", "Trajan Pro", Georgia, serif;
  --ui: "Inter", -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.2, .7, .1, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f0f0c; --surface: #181814; --surface-2: #23231d; --ink: #efe9da; --ink-2: #bdb6a3; --muted: #8b8573; --line: #302f27;
    --brand: #a9d08f; --brand-ink: #0f0f0c; --gold: #d9bc72; --gold-soft: #3a2f14;
    --good: #7fcf9b; --good-soft: #1d3325; --bad: #f08c78; --bad-soft: #3d201a; --info: #9cb8de; --info-soft: #1e2a3a;
    --bar: #8dbe78; --stage: #060605;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f0f0c; --surface: #181814; --surface-2: #23231d; --ink: #efe9da; --ink-2: #bdb6a3; --muted: #8b8573; --line: #302f27;
  --brand: #a9d08f; --brand-ink: #0f0f0c; --gold: #d9bc72; --gold-soft: #3a2f14;
  --good: #7fcf9b; --good-soft: #1d3325; --bad: #f08c78; --bad-soft: #3d201a; --info: #9cb8de; --info-soft: #1e2a3a;
  --bar: #8dbe78; --stage: #060605;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.6);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--stage); color: var(--ink); font: 15px/1.5 var(--ui); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Device shell ---------- */
.app { position: relative; height: 100%; max-width: 460px; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 600px) and (min-height: 700px) {
  body { padding-block: 20px; }
  .app { height: calc(100% - 40px); border-radius: 34px; box-shadow: 0 0 0 10px #111, 0 0 0 11px #2a2a26, 0 40px 80px -20px rgba(0,0,0,.5); }
}
.demo-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px; background: #111; color: #d8d2c0; font-size: .74rem; flex: none; }
.demo-bar span { opacity: .7; letter-spacing: .04em; }
.role { display: inline-flex; padding: 2px; border-radius: 999px; background: #2a2a24; }
.role button { border: 0; background: transparent; color: #cfc8b4; padding: 4px 12px; border-radius: 999px; font-size: .74rem; font-weight: 600; cursor: pointer; }
.role button[aria-pressed="true"] { background: #efe9da; color: #111; }
.top { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; background: var(--bg); }
.top h1 { font-family: var(--display); font-weight: 600; font-size: 1.7rem; line-height: 1.1; flex: 1; min-width: 0; }
.top .sub { display: block; font-family: var(--ui); font-size: .74rem; font-weight: 500; color: var(--muted); letter-spacing: .04em; }
.icon-btn { position: relative; width: 38px; height: 38px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 18px; height: 18px; }
.badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: .66rem; font-weight: 700; display: grid; place-items: center; }
.avatar { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: .82rem; color: #f4f1e8; background: var(--t-germoglio); }
.avatar.t-raccolto { background: var(--t-raccolto); } .avatar.t-riserva { background: var(--t-riserva); color: #d9bc72; box-shadow: 0 0 0 1px #8a6d2f inset; }
main { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 18px; }
main > * { flex-shrink: 0; }
.tabbar { flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-top: 1px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar button { border: 0; background: none; padding: 9px 2px 8px; display: grid; justify-items: center; gap: 3px; font-size: .66rem; font-weight: 600; color: var(--muted); cursor: pointer; position: relative; letter-spacing: .02em; }
.tabbar svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar .badge { top: 4px; right: calc(50% - 22px); }

/* ---------- Generic blocks ---------- */
.section-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.section-h h2 { font-family: var(--display); font-size: 1.35rem; font-weight: 600; }
.section-h a, .link { font-size: .8rem; font-weight: 600; color: var(--gold); background: none; border: 0; padding: 0; cursor: pointer; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: .8rem; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: .88rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.gold { background: linear-gradient(100deg, #8a6d2f, #d9bc72 45%, #b8923f); color: #120f08; border: 0; }
.btn.block { width: 100%; }
.btn.sm { padding: 6px 12px; font-size: .78rem; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: .78rem; font-weight: 600; white-space: nowrap; cursor: pointer; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.pill.news { background: var(--info-soft); color: var(--info); }
.pill.event { background: var(--good-soft); color: var(--good); }
.pill.invite { background: var(--gold-soft); color: var(--gold); }
.pill.message { background: var(--surface-2); color: var(--ink-2); }
.pill.risk { background: var(--bad-soft); color: var(--bad); }
.tier-tag { font-family: var(--caps); font-size: .66rem; font-weight: 600; letter-spacing: .12em; padding: 2px 7px; border-radius: 5px; border: 1px solid currentColor; white-space: nowrap; }
.tier-tag.germoglio { color: var(--good); } .tier-tag.raccolto { color: #b0782f; } .tier-tag.riserva { color: #0e0d0b; background: #d9bc72; border-color: #8a6d2f; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; font-size: .9rem; }
.field { display: grid; gap: 5px; }
.field label, .lbl { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.input { width: 100%; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
textarea.input { resize: vertical; min-height: 90px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.toggle:last-child { border-bottom: 0; }
.switch { position: relative; width: 44px; height: 26px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 13px; background: var(--surface-2); border: 1px solid var(--line); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s var(--ease); }
.switch input:checked + span { background: var(--brand); border-color: var(--brand); }
.switch input:checked + span::after { transform: translateX(18px); }

/* ---------- Floating contactless card ---------- */
.fcard-wrap { perspective: 1200px; padding: 6px 4px 14px; }
.fcard { position: relative; aspect-ratio: 1011 / 638; border-radius: 16px; overflow: hidden; container-type: inline-size; color: var(--c-ink);
  background: #111 var(--img) center / cover; animation: float 7s ease-in-out infinite;
  transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  box-shadow: 0 0 0 1px rgba(255,255,255,.07) inset, 0 1px 0 rgba(255,255,255,.2) inset, 0 20px 36px -14px rgba(0,0,0,.6), 0 50px 70px -40px rgba(0,0,0,.55); }
@keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -7px; } }
.fcard::before { content: ""; position: absolute; inset: 0; background: linear-gradient(168deg, rgba(255,255,255,.24), rgba(255,255,255,0) 40%), linear-gradient(0deg, rgba(0,0,0,.25), transparent 40%); mix-blend-mode: soft-light; pointer-events: none; }
.fcard::after { content: ""; position: absolute; top: -60%; bottom: -60%; width: 28%; left: -40%; transform: rotate(18deg); pointer-events: none; mix-blend-mode: screen;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.08) 30%, rgba(255,255,255,.32) 50%, rgba(255,255,255,.08) 70%, transparent); animation: sheen 7.5s var(--ease) infinite; }
@keyframes sheen { 0%, 62% { left: -40%; } 100% { left: 130%; } }
.fcard.germoglio { --c-ink: #f1ecdd; --c-label: #a8c79a; } .fcard.raccolto { --c-ink: #f7ebd3; --c-label: #d8a547; } .fcard.riserva { --c-ink: #efe3c2; --c-label: #c2a45c; }
.fc-in { position: absolute; inset: 0; padding: 6.5cqw 7cqw 6cqw; display: grid; grid-template-rows: auto 1fr auto; z-index: 1; }
.fc-top { display: flex; justify-content: space-between; align-items: flex-start; }
.fc-h { font-family: var(--caps); font-weight: 600; font-size: 3.4cqw; letter-spacing: .3em; line-height: 1; }
.fc-d { font-family: var(--display); font-style: italic; font-weight: 500; font-size: 4.6cqw; color: var(--c-label); line-height: 1.2; }
.fc-nfc { width: 6.4cqw; }
.fc-tier { align-self: end; font-family: var(--caps); font-weight: 600; font-size: 7.6cqw; letter-spacing: .18em; line-height: 1; margin-bottom: 4cqw; text-shadow: 0 .15cqw 0 rgba(0,0,0,.55); }
.fc-bot { display: flex; justify-content: space-between; align-items: flex-end; }
.fc-lbl { display: block; font-size: 1.9cqw; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--c-label); margin-bottom: .6cqw; }
.fc-name { font-family: var(--display); font-weight: 600; font-size: 4.8cqw; line-height: 1; }
.fc-num { font-size: 3.1cqw; letter-spacing: .22em; font-variant-numeric: tabular-nums; }
.fcard.riserva .fc-tier, .fcard.riserva .fc-h { background: linear-gradient(100deg, #8a6d2f, #e8cf8a 20%, #b8923f 35%, #fff1c4 48%, #b8923f 62%, #e8cf8a 80%, #8a6d2f); background-size: 240% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: foil 6s linear infinite; text-shadow: none; }
@keyframes foil { to { background-position: 240% 0; } }

/* points + progress */
.points { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.points .pts-n { display: block; font-family: var(--display); font-size: 2.8rem; font-weight: 600; line-height: .9; }
.points .lbl { display: block; margin-bottom: 4px; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: linear-gradient(90deg, #b8923f, #e3c77e); transition: width .8s var(--ease); }

/* ---------- Feed ---------- */
.post { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; overflow: hidden; padding: 0; cursor: pointer; color: inherit; }
.post-art { height: 112px; position: relative; background-size: cover; background-position: center; }
.post-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.35)); }
.post-body { padding: 14px 16px 16px; display: grid; gap: 7px; }
.post-body h3 { font-family: var(--display); font-size: 1.32rem; line-height: 1.15; }
.post-body p { color: var(--ink-2); font-size: .9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.post-meta { display: flex; align-items: center; gap: 8px; font-size: .74rem; color: var(--muted); }
.datebox { position: absolute; left: 14px; bottom: -18px; z-index: 1; width: 52px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); text-align: center; padding: 5px 0 6px; line-height: 1; }
.datebox b { display: block; font-family: var(--display); font-size: 1.6rem; }
.datebox span { font-size: .6rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--bad); }
.has-date .post-body { padding-top: 24px; }
.rsvp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.rsvp button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 4px; font-size: .78rem; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.rsvp button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.detail-art { height: 190px; border-radius: 18px; background-size: cover; background-position: center; }
.detail-body { display: grid; gap: 12px; }
.detail-body h2 { font-family: var(--display); font-size: 1.9rem; line-height: 1.1; }
.detail-body .text { color: var(--ink-2); white-space: pre-line; }
.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.facts div { background: var(--surface); padding: 10px 12px; }
.facts b { display: block; font-size: .95rem; }

/* ---------- Chat ---------- */
.chat { display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 82%; padding: 9px 13px; border-radius: 18px; font-size: .92rem; line-height: 1.4; white-space: pre-line; }
.msg.them { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg.me { align-self: flex-end; background: var(--brand); color: var(--brand-ink); border-bottom-right-radius: 6px; }
.msg small { display: block; font-size: .64rem; opacity: .65; margin-top: 3px; }
.day-sep { align-self: center; font-size: .7rem; color: var(--muted); font-weight: 600; letter-spacing: .06em; padding: 6px 0; }
.composer { flex: none; display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--surface); }
.composer input { flex: 1; min-width: 0; border-radius: 999px; }
.composer .btn { border-radius: 999px; }
.thread { display: flex; gap: 12px; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; cursor: pointer; }
.thread .t-main { flex: 1; min-width: 0; }
.thread .t-main b { display: flex; justify-content: space-between; gap: 8px; font-size: .92rem; }
.thread .t-main b small { font-weight: 500; color: var(--muted); font-size: .72rem; }
.thread .t-main span { display: block; font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thread.unread .t-main span { color: var(--ink); font-weight: 600; }

/* ---------- Lists & stats ---------- */
.list-row { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; cursor: pointer; }
.list-row .grow { flex: 1; min-width: 0; }
.list-row .grow b { display: block; font-size: .92rem; }
.list-row .grow span { display: block; font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-row .end { text-align: right; font-size: .86rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.list-row .end small { display: block; font-weight: 500; color: var(--muted); font-size: .72rem; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.kpi b { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; line-height: 1.25; }
.kpi small { font-size: .74rem; color: var(--muted); }
.up { color: var(--good); } .down { color: var(--bad); }
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 11px; }
.rank li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 3px 8px; align-items: baseline; }
.rank .pos { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.rank .nm { font-weight: 600; font-size: .88rem; min-width: 0; }
.rank .val { font-size: .8rem; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.rank .val small { color: var(--muted); }
.rank .track { grid-column: 2 / 4; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.rank .track i { display: block; height: 100%; background: var(--bar); border-radius: 0 3px 3px 0; }
.rank li:first-child .track i { background: var(--gold); }
.favs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fav { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 12px 14px; display: grid; gap: 2px; }
.fav b { font-family: var(--display); font-size: 1.12rem; line-height: 1.15; }
.fav small { color: var(--muted); font-size: .76rem; }
.mix { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.mix i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 10px var(--ui); }
.chart .grid { stroke: var(--line); }
.chart .b { fill: var(--bar); }
.chart .v { fill: var(--ink); font-weight: 600; }
.receipt { border-bottom: 1px solid var(--line); padding: 10px 0; }
.receipt summary { display: flex; justify-content: space-between; gap: 10px; cursor: pointer; list-style: none; font-size: .88rem; }
.receipt summary::-webkit-details-marker { display: none; }
.receipt summary small { display: block; color: var(--muted); font-size: .76rem; }
.receipt ul { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: .82rem; color: var(--ink-2); }
.receipt li { display: flex; justify-content: space-between; }
