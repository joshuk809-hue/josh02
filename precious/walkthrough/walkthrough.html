<title>Precious Beauty Walkthrough</title>

<style>
/* Layout: left = story text + controls, right = phone that acts out each step. One dark brand look (black + gold), by design. */
:root {
  color-scheme: dark;
  --bg: #0C0C0C; --panel: #151310; --line: rgba(233,214,176,.14);
  --fg: #F3EBDD; --muted: rgba(243,235,221,.66); --gold: #D4A857; --gold-hi: #F2DBA6;
  --ok: #7FBF8E; --warn: #E2BC72; --stop: #D9734E;
  --wa: #0B141A; --wa-in: #202C33; --wa-out: #005C4B;
  --display: 'Kanit', system-ui, sans-serif; --body: 'Kanit', system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 300 16px/1.55 var(--body); }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; }
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
header img { width: 52px; height: 52px; border-radius: 50%; box-shadow: 0 0 24px rgba(212,168,87,.25); }
header h1 { margin: 0; font: 800 clamp(1.5rem, 4vw, 2.2rem)/1 var(--display); text-transform: uppercase; letter-spacing: .01em;
  background: linear-gradient(180deg, #8A6A3A, var(--gold-hi)); -webkit-background-clip: text; background-clip: text; color: transparent; }
header p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }
.grow { flex: 1; min-width: 200px; }
.lang { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.lang button, .tabs button { font: inherit; cursor: pointer; border: 0; background: none; color: var(--muted); border-radius: 999px; padding: 6px 12px; }
.lang button[aria-pressed="true"] { background: var(--gold); color: #1A1206; font-weight: 500; }

.tabs { display: flex; gap: 6px; margin: 26px 0 18px; overflow-x: auto; padding-bottom: 2px; }
.tabs button { border: 1px solid var(--line); padding: 10px 16px; white-space: nowrap; font-size: .95rem; }
.tabs button[aria-selected="true"] { border-color: var(--gold); color: var(--fg); background: rgba(212,168,87,.1); }
.tabs b { color: var(--gold); font-weight: 500; margin-right: 6px; }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
@media (max-width: 760px) { .stage { grid-template-columns: 1fr; } .phone { margin: 0 auto; } }

.story { min-width: 0; }
.progress { display: flex; gap: 6px; margin-bottom: 18px; }
.progress span { flex: 1; height: 4px; border-radius: 4px; background: var(--line); transition: background .3s; }
.progress span.on { background: var(--gold); }
.step-n { font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.story h2 { font: 600 clamp(1.35rem, 3vw, 1.8rem)/1.2 var(--display); margin: 6px 0 12px; text-wrap: balance; }
.story p { margin: 0 0 12px; max-width: 60ch; color: var(--muted); }
.story p strong { color: var(--fg); font-weight: 500; }
.say { border-left: 2px solid var(--gold); padding: 10px 14px; margin: 16px 0; background: rgba(212,168,87,.06); border-radius: 0 12px 12px 0; }
.say small { display: block; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-bottom: 2px; }
.say span { color: var(--fg); }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); margin-top: 4px; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status.ok { color: var(--ok); } .status.warn { color: var(--warn); } .status.stop { color: var(--stop); }
.nav { display: flex; gap: 10px; margin-top: 22px; }
.btn { font: 500 .95rem var(--body); cursor: pointer; border-radius: 999px; padding: 11px 22px; border: 1px solid var(--line); background: none; color: var(--fg); transition: transform .12s; }
.btn:active { transform: scale(.97); }
.btn.gold { border: 0; color: #1A1206; background: linear-gradient(123deg, #6B4A16 7%, #D4A857 37%, #F2DBA6 72%, #A9772E 100%); }
.btn:disabled { opacity: .35; cursor: default; }
button:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }

/* Phone */
.phone { width: 300px; max-width: 100%; height: 600px; border-radius: 44px; padding: 12px; background: #050505; border: 1px solid #2a2620;
  box-shadow: 0 30px 60px rgba(0,0,0,.6), inset 0 0 0 2px #1b1814; position: relative; }
.phone::before { content: ''; position: absolute; top: 18px; left: 50%; width: 90px; height: 22px; margin-left: -45px; background: #000; border-radius: 20px; z-index: 3; }
.screen { width: 100%; height: 100%; border-radius: 34px; overflow: hidden; background: var(--bg); position: relative; }
.screen > div { position: absolute; inset: 0; padding: 52px 16px 16px; display: flex; flex-direction: column; gap: 10px; animation: in .35s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .screen > div, .pulse, .tapdot { animation: none !important; } }
.app-h { display: flex; align-items: center; gap: 8px; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.app-h img { width: 26px; height: 26px; border-radius: 50%; }
.card { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; font-size: .85rem; }
.card .t { color: var(--gold-hi); font-weight: 500; }
.pill { display: block; text-align: center; border-radius: 999px; padding: 10px; font-size: .78rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
.pill.g { color: #1A1206; background: linear-gradient(123deg, #6B4A16 7%, #D4A857 37%, #F2DBA6 72%, #A9772E 100%); }
.pill.o { border: 1.5px solid #E9D6B0; color: #E9D6B0; }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(212,168,87,.25); } }
.row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.num { font-variant-numeric: tabular-nums; }
.down { color: var(--stop); } .up { color: var(--ok); }
.wa { background: var(--wa) !important; }
.wa .bar { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid #1f2c33; font-size: .9rem; }
.wa .bar img { width: 30px; height: 30px; border-radius: 50%; }
.bub { max-width: 85%; padding: 8px 10px; border-radius: 10px; font-size: .82rem; line-height: 1.4; }
.bub.in { background: var(--wa-in); align-self: flex-start; }
.bub.out { background: var(--wa-out); align-self: flex-end; }
.bub small { display: block; color: rgba(255,255,255,.5); font-size: .68rem; text-align: right; margin-top: 2px; }
.bub .auto { color: var(--warn); font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; display: block; margin-bottom: 2px; }
.typing { margin-top: auto; display: flex; gap: 8px; align-items: center; background: #1f2c33; border-radius: 999px; padding: 8px 12px; font-size: .8rem; color: rgba(255,255,255,.75); }
.typing b { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; background: #00A884; display: grid; place-items: center; color: #fff; font-weight: 600; }
.nfc { margin: 40px auto 0; width: 230px; height: 145px; border-radius: 14px; background: radial-gradient(ellipse at 50% 45%, #2a2218, #050403 75%); border: 1px solid #3a3226;
  display: grid; place-items: center; position: relative; }
.nfc img { width: 80px; border-radius: 50%; }
.tapdot { position: absolute; right: 18px; bottom: 14px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--gold); animation: ring 1.4s ease-out infinite; }
@keyframes ring { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }
.big { text-align: center; font: 800 1.6rem/1.1 var(--display); text-transform: uppercase;
  background: linear-gradient(180deg, #8A6A3A, var(--gold-hi)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.center { text-align: center; color: var(--muted); font-size: .85rem; }
.flow { display: grid; gap: 8px; margin-top: 6px; }
.flow .card { display: flex; gap: 10px; align-items: center; }
.flow .ico { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; background: rgba(212,168,87,.12); color: var(--gold-hi); font-size: .8rem; font-weight: 600; }
.arrow { text-align: center; color: var(--gold); line-height: 1; font-size: .9rem; }

.who { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 22px; }
.who h3 { font: 600 1.2rem var(--display); margin: 0 0 12px; }
.who .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.who .col { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
.who .col b { display: block; color: var(--gold); font-weight: 500; letter-spacing: .1em; text-transform: uppercase; font-size: .8rem; margin-bottom: 6px; }
.who ul { margin: 0; padding-left: 18px; color: var(--muted); }
.who li { margin: 4px 0; }
.who li.done { color: var(--ok); list-style: '✓  '; }
</style>

  wa3: () => `<div class="wa"><div class="bar"><img src="${LOGO}" alt="">Precious Beauty</div><div class="bub out">${L('Knotless braids, Saturday morning? 📷', 'Knotless, sabato mattina? 📷')}<small>10:45 ✓✓</small></div><div class="bub in">${L('Hi Amara, your appointment for braids is confirmed: Saturday 18 October, 10:00. See you soon! — Precious', 'Ciao Amara, il tuo appuntamento per trecce è confermato: sabato 18 ottobre, 10:00. A presto! — Precious')}<small>12:10</small></div></div>`,
  site: () => `<div><div class="big" style="font-size:2.3rem;margin-top:6px">Precious</div><div class="card"><div class="row"><span>${L('Braids', 'Trecce')}</span><span class="num">${L('from', 'da')} 25€</span></div></div><div class="card"><div class="row"><span>${L('Haircut', 'Taglio')}</span><span class="num">15€</span></div></div><div class="card"><div class="row"><span>${L('Lashes', 'Ciglia')}</span><span class="num">${L('from', 'da')} 20€</span></div></div><div class="card"><div class="t">${L('Visit the salon', 'Vieni in salone')}</div>Via Paleocapa 8/B<br>24122 Bergamo · ${L('Directions', 'Indicazioni')} →</div><span class="pill g">${L('Book on WhatsApp', 'Prenota su WhatsApp')}</span></div>`,

  follow: () => `<div class="wa"><div class="bar"><img src="${LOGO}" alt="">Sofia</div><div class="bub out">${L('Hi Sofia, thank you for coming in! I hope you love your new look. A quick review would mean a lot: g.page/… And tag me on Instagram 💛 — Precious', 'Ciao Sofia, grazie per la visita! Spero che il nuovo look ti piaccia. Una recensione per me vale tantissimo: g.page/… E taggami su Instagram 💛 — Precious')}<small>11:00 ✓✓</small></div><div class="bub in">⭐⭐⭐⭐⭐ ${L('Done! Love them', 'Fatto! Bellissime')}<small>11:20</small></div></div>`,

  recipe: () => flow([['GH', 'GitHub', L('The recipe: all the code, every version', 'La ricetta: tutto il codice, ogni versione'), 'ok']]),
  guard: () => flow([['GH', 'GitHub', L('Recipe', 'Ricetta'), 'ok'], ['✓', L('Safety guard', 'Controllo'), L('35 sample photos · 3 fake links', '35 foto di esempio · 3 link finti'), 'stop']]),
  oven: () => flow([['GH', 'GitHub', L('Recipe', 'Ricetta'), 'ok'], ['✓', L('Safety guard', 'Controllo'), L('Passed', 'Superato'), 'ok'], ['▲', 'Vercel', L('Builds + hosts · https 🔒', 'Costruisce + ospita · https 🔒'), 'warn']]),
  domain: () => flow([['▲', 'Vercel', L('The website', 'Il sito'), 'ok'], ['www', 'preciousbeauty.it', L('The address people type', "L'indirizzo che si scrive"), 'warn']]),
  live: () => `<div style="align-items:center;text-align:center"><div class="card" style="width:100%;font-size:.75rem">🔒 preciousbeauty.it</div><img src="${LOGO}" alt="" style="width:120px;border-radius:50%;margin-top:14px;box-shadow:0 0 40px rgba(212,168,87,.35)"><div class="big" style="font-size:2rem">${L('Open', 'Aperto')}</div><p class="center">${L('NFC card · Google · Instagram → one website', 'Biglietto NFC · Google · Instagram → un solo sito')}</p><span class="pill g">${L('Book on WhatsApp', 'Prenota su WhatsApp')}</span></div>`,
}
function flow(items) {
  const colors = { ok: 'var(--ok)', warn: 'var(--warn)', stop: 'var(--stop)' }
  return `<div>${head(L('How it goes online', 'Come va online'))}<div class="flow">${items.map(([ico, name, sub, st], i) =>
    `${i ? '<div class="arrow">↓</div>' : ''}<div class="card"><span class="ico">${ico}</span><span style="flex:1"><span class="t">${name}</span><br><span style="color:var(--muted)">${sub}</span></span><span style="width:10px;height:10px;border-radius:50%;background:${colors[st]}"></span></div>`).join('')}</div></div>`
}

let lang = 'en', tab = 0, step = 0
try { const s = JSON.parse(localStorage.getItem('pb-walk') || '{}'); lang = s.lang || lang } catch {}

const $ = (id) => document.getElementById(id)
function render() {
  const t = T[lang], steps = STORIES[lang][tab], st = steps[step]
  document.documentElement.lang = lang
  $('subtitle').textContent = t.subtitle
  $('l-en').setAttribute('aria-pressed', lang === 'en'); $('l-it').setAttribute('aria-pressed', lang === 'it')
  $('tabs').innerHTML = t.tabs.map((name, i) => `<button role="tab" aria-selected="${i === tab}" data-tab="${i}"><b>${i + 1}</b>${name}</button>`).join('')
  $('progress').innerHTML = steps.map((_, i) => `<span class="${i <= step ? 'on' : ''}"></span>`).join('')
  $('stepn').textContent = t.step(step + 1, steps.length)
  $('title').textContent = st.t
  $('body').innerHTML = `<p>${st.p}</p>` +
    (st.say ? `<div class="say"><small>${lang === 'it' ? 'Dillo così' : 'Say it like this'}</small><span>“${st.say}”</span></div>` : '') +
    (st.st ? `<span class="status ${st.st[0]}"><i></i>${st.st[1]}</span>` : '')
  $('screen').innerHTML = SCREENS[st.s]()
  $('back').textContent = t.back; $('back').disabled = tab === 0 && step === 0
  const last = tab === 2 && step === steps.length - 1
  $('next').textContent = last ? t.again : t.next
  $('who').innerHTML = `<h3>${t.whoTitle}</h3><div class="grid">${t.who.map(([h, items, done]) =>
    `<div class="col"><b>${h}</b><ul>${items.map((x) => `<li class="${done ? 'done' : ''}">${x}</li>`).join('')}</ul></div>`).join('')}</div>`
}
$('next').onclick = () => {
  const n = STORIES[lang][tab].length
  if (step < n - 1) step++
  else if (tab < 2) { tab++; step = 0 }
  else { tab = 0; step = 0 }
  render()
}
$('back').onclick = () => {
  if (step > 0) step--
  else if (tab > 0) { tab--; step = STORIES[lang][tab].length - 1 }
  render()
}
$('tabs').onclick = (e) => { const b = e.target.closest('[data-tab]'); if (b) { tab = +b.dataset.tab; step = 0; render() } }
for (const l of ['en', 'it']) $('l-' + l).onclick = () => { lang = l; try { localStorage.setItem('pb-walk', JSON.stringify({ lang })) } catch {} ; render() }
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') $('next').click(); if (e.key === 'ArrowLeft') $('back').click() })
render()
</script>
